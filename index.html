<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1033">
<title>Happy Birthday 🎁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff8fc7;
    --pink-light: #ffc4e1;
    --pink-deep: #ff5fa8;
    --purple: #a86fe0;
    --purple-deep: #3a2a5a;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    width: 100%;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    color: #fff;
    background: linear-gradient(180deg, #1a1033 0%, #2a1b4a 45%, #3a2a5a 100%);
  }

  /* ================= BACKGROUND ================= */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .bubbles {
    position: absolute;
    inset: 0;
  }

  .bubble {
    position: absolute;
    bottom: -120px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04) 60%, transparent 70%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    animation: bubbleFloat linear infinite;
    will-change: transform;
  }

  @keyframes bubbleFloat {
    0% {
      transform: translateY(0) translateX(0);
      opacity: 0;
    }
    10% { opacity: 0.9; }
    90% { opacity: 0.9; }
    100% {
      transform: translateY(-120vh) translateX(30px);
      opacity: 0;
    }
  }

  .mountains {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 32vh;
    min-height: 200px;
    display: block;
    pointer-events: none;
  }

  /* ================= CONFETTI ================= */
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  /* ================= MUSIC BUTTON ================= */
  .music-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 30;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }
  .music-btn:hover { background: rgba(255, 255, 255, 0.18); }
  .music-btn:active { transform: scale(0.9); }

  /* ================= SCREENS ================= */
  .screen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    padding: 24px 16px;
    overflow-y: auto;
    overflow-x: hidden;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.5s ease, visibility 0.5s;
  }

  .screen.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .screen > .glass {
    margin: auto;
    transition: transform 0.5s ease, opacity 0.5s ease;
  }

  .screen.exiting > .glass {
    transform: scale(0.82);
    opacity: 0;
  }

  /* ================= GLASS CARD ================= */
  .glass {
    width: 100%;
    max-width: 460px;
    padding: 28px 22px;
    border-radius: 26px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    text-align: center;
    animation: cardIn 0.7s cubic-bezier(0.19, 1, 0.22, 1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ================= TYPOGRAPHY ================= */
  .title {
    font-size: clamp(20px, 5.5vw, 26px);
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #ffc4e1, #ff8fc7, #c79fff, #ffc4e1);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 6s linear infinite;
  }

  @keyframes shine {
    from { background-position: 0% 50%; }
    to { background-position: 300% 50%; }
  }

  .subtitle {
    font-size: 14px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 18px;
  }

  .hint {
    font-size: 12.5px;
    color: rgba(255, 255, 255, 0.55);
    margin-top: 14px;
    font-style: italic;
  }

  /* ================= GAME GRID ================= */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 6px 0 4px;
  }

  .card {
    aspect-ratio: 1 / 1;
    perspective: 800px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
    will-change: transform;
  }

  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    font-size: clamp(22px, 7vw, 32px);
    user-select: none;
  }

  .card-front {
    background: linear-gradient(135deg, rgba(255, 143, 199, 0.28), rgba(168, 111, 224, 0.28));
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: rgba(255, 255, 255, 0.5);
    font-weight: 700;
    font-size: 20px;
    box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.06);
  }

  .card-back {
    background: linear-gradient(135deg, #ff8fc7, #a86fe0);
    border: 1px solid rgba(255, 255, 255, 0.35);
    transform: rotateY(180deg);
    box-shadow: 0 0 20px rgba(255, 143, 199, 0.35);
  }

  .card.matched .card-back {
    animation: pop 0.45s ease;
  }

  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.12); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  .card.matched {
    pointer-events: none;
  }

  /* ================= CAKE ================= */
  .cake-wrap {
    position: relative;
    width: 210px;
    height: 230px;
    margin: 18px auto 10px;
  }

  .plate {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 14px;
    background: linear-gradient(180deg, #e8d9ff, #9c7bc9);
    border-radius: 50%;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  }

  .layer {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 12px 12px 8px 8px;
    box-shadow: inset 0 -10px 0 rgba(0, 0, 0, 0.12), 0 6px 18px rgba(0, 0, 0, 0.25);
  }

  .layer-bottom {
    bottom: 10px;
    width: 170px;
    height: 72px;
    background: linear-gradient(180deg, #ff9bc9, #ff5fa8);
  }
  .layer-bottom::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 16px;
    background: linear-gradient(180deg, #ffd0e6, #ff9bc9);
    border-radius: 12px 12px 50% 50% / 12px 12px 18px 18px;
  }

  .layer-top {
    bottom: 82px;
    width: 130px;
    height: 58px;
    background: linear-gradient(180deg, #ffb6d9, #ff8fc7);
  }
  .layer-top::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 14px;
    background: linear-gradient(180deg, #ffe3f0, #ffb6d9);
    border-radius: 12px 12px 50% 50% / 12px 12px 16px 16px;
  }

  .layer-bottom::after,
  .layer-top::after {
    content: '';
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    height: 8px;
    background-image: radial-gradient(circle, #fff 0 2px, transparent 2.5px);
    background-size: 14px 8px;
    background-repeat: repeat-x;
    opacity: 0.5;
    pointer-events: none;
  }

  .candle {
    position: absolute;
    bottom: 140px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 48px;
    background: repeating-linear-gradient(45deg, #ffffff 0 7px, #ff8fc7 7px 14px);
    border-radius: 3px;
    z-index: 3;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }

  .flame {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 26px;
    background: radial-gradient(ellipse at center bottom, #fff59d 0%, #ffb74d 45%, #ff6f00 75%, #ff3d00 100%);
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    box-shadow: 0 0 22px #ffb74d, 0 0 48px #ff9800, 0 0 70px rgba(255, 152, 0, 0.5);
    animation: flicker 0.32s infinite alternate ease-in-out;
    transform-origin: center bottom;
    will-change: transform;
  }

  .flame::before {
    content: '';
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 9px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.85;
  }

  @keyframes flicker {
    0% { transform: translateX(-50%) scale(1) rotate(-4deg); }
    100% { transform: translateX(-50%) scale(1.1) rotate(4deg); }
  }

  .flame.out {
    animation: blowOut 0.55s ease forwards;
  }

  @keyframes blowOut {
    0% { transform: translateX(-50%) scale(1); opacity: 1; }
    60% { transform: translateX(-50%) scale(1.4, 0.7); opacity: 0.6; }
    100% { transform: translateX(-50%) scale(0); opacity: 0; }
  }

  .smoke {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    background: rgba(200, 200, 210, 0.75);
    border-radius: 50%;
    opacity: 0;
    filter: blur(5px);
    pointer-events: none;
  }

  .smoke.active {
    animation: smokeUp 1.6s ease-out forwards;
  }

  @keyframes smokeUp {
    0% { opacity: 0.85; transform: translate(-50%, 0) scale(0.8); }
    100% { opacity: 0; transform: translate(-50%, -75px) scale(3); }
  }

  .wish-text {
    font-size: 14.5px;
    line-height: 1.65;
    color: rgba(255, 255, 255, 0.88);
    margin: 10px 6px 22px;
  }

  /* ================= BUTTON ================= */
  .btn {
    display: inline-block;
    padding: 14px 34px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff6eb4, #a86fe0);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.4px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 10px 26px rgba(255, 110, 180, 0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.4s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 32px rgba(255, 110, 180, 0.55);
  }

  .btn:active { transform: scale(0.96); }

  .btn:disabled {
    cursor: not-allowed;
    opacity: 0.5;
    transform: none;
  }

  /* ================= LETTER ================= */
  .letter-card {
    padding-top: 24px;
  }

  .avatar {
    width: 96px;
    height: 96px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255, 143, 199, 0.4), rgba(168, 111, 224, 0.4));
    border: 3px solid rgba(255, 255, 255, 0.35);
    box-shadow: 0 0 26px rgba(255, 143, 199, 0.45), inset 0 0 20px rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    animation: avatarPulse 3s ease-in-out infinite;
  }

  @keyframes avatarPulse {
    0%, 100% { box-shadow: 0 0 26px rgba(255, 143, 199, 0.45), inset 0 0 20px rgba(255, 255, 255, 0.1); }
    50% { box-shadow: 0 0 40px rgba(255, 143, 199, 0.7), inset 0 0 20px rgba(255, 255, 255, 0.15); }
  }

  .avatar svg {
    width: 88%;
    height: 88%;
  }

  .letter-title {
    margin-bottom: 14px;
  }

  .letter-body {
    text-align: left;
    font-size: 14px;
    line-height: 1.75;
    color: rgba(255, 255, 255, 0.92);
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 6px;
    min-height: 40px;
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #ff8fc7;
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.9s step-end infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }

  .wa-btn {
    margin-top: 22px;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease, box-shadow 0.2s ease;
  }

  .wa-btn.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 380px) {
    .glass { padding: 22px 16px; border-radius: 22px; }
    .game-grid { gap: 8px; }
    .cake-wrap { width: 190px; height: 210px; transform: scale(0.92); }
    .wish-text { font-size: 13.5px; }
    .letter-body { font-size: 13px; }
  }

  @media (min-height: 750px) {
    .cake-wrap { margin-top: 24px; margin-bottom: 16px; }
  }
</style>
</head>

<div class="bg-layer">

    <path d="M0,224L60,213.3C120,203,240,181,360,181.3C480,181,600,203,720,213.3C840,224,960,224,1080,208C1200,192,1320,160,1380,144L1440,128L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z" fill="#0d0722" opacity="0.9"/>

<script>
/* ============================================================
   KONFIGURASI — GANTI DI SINI
   ============================================================ */
const WA_NUMBER  = '6281234567890';   // Ganti nomor WhatsApp (format internasional tanpa +, contoh: 6281234567890)
const WA_MESSAGE = 'Makasih ya udah bikin hari ulang tahunku jadi spesial 🥺💖';

const LETTER_TEXT =
`Kita make a wish di hari ulang tahunmu ini yaa 🥺 Semoga kamu selalu diberi kesehatan, hati yang tenang, dan langkah yang dimudahkan dalam setiap rencana baikmu serta kebahagiaan selalu menyertaimu 🫶

Semoga di usia yang baru ini, kamu makin kuat, makin sabar, dan makin percaya sama diri sendiri. Apa pun yang kamu impikan, pelan-pelan semoga satu per satu bisa terwujud dengan cara terbaik 💕

Semangat terus buat kejar semua keinginan kamu, jangan pernah takut gagal yaa, aku selalu dukung kamu dan support kamu di sini. Oh ya, jangan lupa untuk selalu bersyukur yaa ✨

Terakhir, Happy Level Up Day And.... Have a Fabulous Birthday 🥺`;
/* ============================================================ */


/* ================= BUBBLES ================= */
(function createBubbles() {
  const container = document.getElementById('bubbles');
  const count = 16;
  for (let i = 0; i < count; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 30 + Math.random() * 70;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.animationDuration = (16 + Math.random() * 18) + 's';
    b.style.animationDelay = (Math.random() * 20) + 's';
    container.appendChild(b);
  }
})();


/* ================= CONFETTI ================= */
const confettiCanvas = document.getElementById('confetti');
const ctx = confettiCanvas.getContext('2d');
let CW, CH;
let particles = [];

const CONFETTI_COLORS = ['#ff8fc7', '#ffd93d', '#a86fe0', '#ff5fa8', '#6ee7ff', '#ffffff', '#ffa94d', '#c79fff'];

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  CW = window.innerWidth;
  CH = window.innerHeight;
  confettiCanvas.width = CW * dpr;
  confettiCanvas.height = CH * dpr;
  confettiCanvas.style.width = CW + 'px';
  confettiCanvas.style.height = CH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function burstConfetti(count = 120, fromTop = true) {
  for (let i = 0; i < count; i++) {
    const px = fromTop
      ? Math.random() * CW
      : CW / 2 + (Math.random() - 0.5) * CW * 0.6;
    const py = fromTop
      ? -20 - Math.random() * 120
      : CH / 2 + (Math.random() - 0.5) * 80;

    particles.push({
      x: px,
      y: py,
      vx: (Math.random() - 0.5) * 4,
      vy: fromTop ? (Math.random() * 3 + 2) : (Math.random() * -14 - 4),
      size: 5 + Math.random() * 7,
      color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.3,
      life: 1,
      shape: Math.random() > 0.55 ? 'rect' : 'circle',
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.04 + Math.random() * 0.06
    });
  }
}

function renderConfetti() {
  ctx.clearRect(0, 0, CW, CH);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.sway += p.swaySpeed;
    p.x += p.vx + Math.sin(p.sway) * 0.8;
    p.y += p.vy;
    p.vy += 0.28;
    p.vx *= 0.995;
    p.rot += p.vr;
    if (fromTopFallCheck(p)) p.life -= 0.006;

    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.shape === 'rect') {
      ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    if (p.life <= 0 || p.y > CH + 60 || p.x < -80 || p.x > CW + 80) {
      particles.splice(i, 1);
    }
  }
  requestAnimationFrame(renderConfetti);
}

function fromTopFallCheck(p) {
  return p.y > 0;
}
renderConfetti();


/* ================= MEMORY GAME ================= */
const EMOJIS = ['🎀', '🦄', '💝', '🎁', '🥺', '💖'];
const gameGrid = document.getElementById('gameGrid');

let firstCard = null;
let secondCard = null;
let lockBoard = false;
let matchedPairs = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildGame() {
  const deck = shuffle([...EMOJIS, ...EMOJIS]);
  gameGrid.innerHTML = '';
  deck.forEach((emoji) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.emoji = emoji;
    card.innerHTML =
      '<div class="card-inner">' +
        '<div class="card-face card-front">?</div>' +
        '<div class="card-face card-back">' + emoji + '</div>' +
      '</div>';
    card.addEventListener('click', () => onCardClick(card));
    gameGrid.appendChild(card);
  });
  firstCard = null;
  secondCard = null;
  lockBoard = false;
  matchedPairs = 0;
}

function onCardClick(card) {
  if (lockBoard) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

  card.classList.add('flipped');

  if (!firstCard) {
    firstCard = card;
    return;
  }

  secondCard = card;
  lockBoard = true;

  if (firstCard.dataset.emoji === secondCard.dataset.emoji) {
    firstCard.classList.add('matched');
    secondCard.classList.add('matched');
    matchedPairs++;

    // Confetti kecil tiap pasangan cocok
    burstConfetti(20, false);

    const a = firstCard, b = secondCard;
    firstCard = null;
    secondCard = null;
    lockBoard = false;

    if (matchedPairs === EMOJIS.length) {
      setTimeout(() => {
        burstConfetti(70, true);
        goToScreen2();
      }, 650);
    }
  } else {
    setTimeout(() => {
      firstCard.classList.remove('flipped');
      secondCard.classList.remove('flipped');
      firstCard = null;
      secondCard = null;
      lockBoard = false;
    }, 800);
  }
}

buildGame();

let typingStarted = false;

function startTypewriter() {
  if (typingStarted) return;
  typingStarted = true;

  const target = document.getElementById('typed');
  const cursor = document.getElementById('cursor');
  const waBtn = document.getElementById('waBtn');

  // Setup WA link
  waBtn.href = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(WA_MESSAGE);

  const chars = Array.from(LETTER_TEXT);
  let i = 0;
  target.textContent = '';
  cursor.style.display = 'inline-block';

  function step() {
    if (i >= chars.length) {
      cursor.style.display = 'none';
      waBtn.classList.add('show');
      burstConfetti(80, true);
      return;
    }

    target.textContent += chars[i];
    const ch = chars[i];
    i++;

    let delay = 22;
    if (ch === '\n') delay = 220;
    else if (ch === '.' || ch === '!' || ch === '?') delay = 180;
    else if (ch === ',' || ch === ';') delay = 90;

    setTimeout(step, delay);
  }

  setTimeout(step, 600);
}


/* ================= MUSIC (Web Audio - Happy Birthday) ================= */
let audioCtx = null;
let musicPlaying = false;
let musicLoopTimeout = null;
const musicBtn = document.getElementById('musicBtn');

const NOTE_FREQ = {
  'G4': 392.00,
  'A4': 440.00,
  'B4': 493.88,
  'C5': 523.25,
  'D5': 587.33,
  'E5': 659.25,
  'F5': 698.46,
  'G5': 783.99
};

// [note, durasi dalam detik]
const MELODY = [
  ['G4', 0.375], ['G4', 0.125], ['A4', 0.5], ['G4', 0.5], ['C5', 0.5], ['B4', 1.0],
  ['G4', 0.375], ['G4', 0.125], ['A4', 0.5], ['G4', 0.5], ['D5', 0.5], ['C5', 1.0],
  ['G4', 0.375], ['G4', 0.125], ['G5', 0.5], ['E5', 0.5], ['C5', 0.5], ['B4', 0.5], ['A4', 1.0],
  ['F5', 0.375], ['F5', 0.125], ['E5', 0.5], ['C5', 0.5], ['D5', 0.5], ['C5', 1.2]
];

function playMelodyOnce(startTime) {
  let t = startTime;
  for (const [note, dur] of MELODY) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = NOTE_FREQ[note] || 440;

    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.13, t + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.95);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);

    t += dur;
  }
  return t;
}

function loopMusic() {
  if (!musicPlaying || !audioCtx) return;
  const endTime = playMelodyOnce(audioCtx.currentTime + 0.1);
  const waitMs = (endTime - audioCtx.currentTime) * 1000 + 2500;
  musicLoopTimeout = setTimeout(loopMusic, waitMs);
}

musicBtn.addEventListener('click', () => {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    musicPlaying = !musicPlaying;

    if (musicPlaying) {
      musicBtn.textContent = '🔊';
      loopMusic();
    } else {
      musicBtn.textContent = '🔇';
      clearTimeout(musicLoopTimeout);
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
    }
  } catch (e) {
    console.warn('Audio tidak didukung:', e);
  }
});
